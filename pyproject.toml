[project]
name = "r64"
version = "0.1.0"
description = "A personal chess sparring partner: plays like a human, learns how you play, trains your weak spots."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chess>=1.11",
    "fastapi>=0.115",
    "numpy>=2.0",
    "torch>=2.5",
    "uvicorn[standard]>=0.32",
    "zstandard>=0.23",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["r64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
