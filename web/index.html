<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>r64</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>r64</h1>
    <span class="tagline">your chess sparring partner</span>
  </header>

  <main>
    <section class="board-col">
      <div class="player-bar" id="top-bar"></div>
      <div class="board-wrap">
        <div id="board" class="board"></div>
        <div id="promotion" class="promotion" hidden></div>
      </div>
      <div class="player-bar" id="bottom-bar"></div>
    </section>

    <aside class="side">
      <div class="panel">
        <h2>New game</h2>
        <form id="new-game">
          <label>Play as
            <select name="color">
              <option value="white">White</option>
              <option value="black">Black</option>
              <option value="random">Random</option>
            </select>
          </label>
          <label>Opponent
            <select name="opponent"></select>
          </label>
          <label id="elo-label">Rating <output id="elo-out">1200</output>
            <input type="range" name="elo" min="600" max="2200" step="10" value="1200">
          </label>
          <p id="elo-fixed" class="hint" hidden></p>
          <button type="submit">Start</button>
        </form>
      </div>

      <div class="panel" id="personal" hidden>
        <h2>Your model</h2>
        <div id="personal-summary" class="hint"></div>
        <ul id="personal-versions" class="versions"></ul>
        <div class="actions">
          <button id="personal-train">Retrain now</button>
        </div>
      </div>

      <div class="panel">
        <div id="status" class="status">Start a new game.</div>
        <ol id="move-list" class="move-list"></ol>
        <div class="actions">
          <button id="resign" disabled>Resign</button>
          <a id="pgn-link" class="button" hidden>Download PGN</a>
        </div>
      </div>

      <div class="panel">
        <h2>Recent games</h2>
        <ul id="games" class="games"></ul>
      </div>
    </aside>
  </main>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
